# The micro run of decision 138 A of the branch m13.11-il-browser-sul-pc, on the branch
# diag-m13.11-osservazione only, which never enters main: the orphaned process group of decision
# 137, without the suite and without a checkout. The first step writes pid, ppid, pgid, sess, stat
# and command of itself, of its ancestors and of launchd — and, since on macOS ps gives sess 0 to
# every process, the true session from getsid —, and `csrutil status`; the witness of
# decision 128 runs as root outside the session, with its dense phase starting when the script
# writes its first line, a dtrace on proc:::signal-send for the signals 1 and 19, and the lines of the
# first step and of the script attached to its comments; then the script, .github/diag/micro.sh,
# carried here in base64. ci.yml and diag.yml are not touched. Written by
# .git/m13.11-il-browser-sul-pc-reference/diag/genera_micro.py.
name: Diag micro

on:
  push:
    branches: ['diag-**']

permissions:
  contents: read
  issues: write

concurrency:
  group: diag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  micro:
    name: micro (${{ matrix.variant }} ${{ matrix.instance }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: riproduzione
            instance: 1
          - variant: senza-fermato-poi-fermato
            instance: 1
          - variant: sessione-sua
            instance: 1
          - variant: riproduzione
            instance: 2
          - variant: senza-fermato-poi-fermato
            instance: 2
          - variant: sessione-sua
            instance: 2
    steps:
      - name: Il primo passo
        continue-on-error: true
        run: |
          mkdir -p "${{ runner.temp }}/micro"
          {
            echo "=== il primo passo (decisione 138): $(date -u +%Y-%m-%dT%H:%M:%SZ), ${{ matrix.variant }}-${{ matrix.instance }}"
            echo "  PID  PPID  PGID     SESS STAT COMM — io e i miei antenati"
            p=$$
            pids=
            while [ -n "$p" ] && [ "$p" != 0 ]; do
              ps -o pid=,ppid=,pgid=,sess=,stat=,comm= -p "$p"
              pids="$pids $p"
              [ "$p" = 1 ] && break
              p=$(ps -o ppid= -p "$p" | tr -d ' ')
            done
            echo "launchd:"
            ps -o pid=,ppid=,pgid=,sess=,stat=,comm= -p 1
            echo "la sessione vera, da getsid (su macOS ps dà sess 0 a ogni processo):"
            for q in $pids 1; do
              python3 -c 'import os, sys; p = int(sys.argv[1]); print(p, "sid", os.getsid(p), "pgid", os.getpgid(p))' "$q" 2>&1
            done
            echo "csrutil status:"
            csrutil status 2>&1 || echo "csrutil: uscita $?"
          } 2>&1 | tee "${{ runner.temp }}/micro/micro-primo-passo.txt"

      - name: Gli strumenti, senza checkout, e il testimone
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # pragma: allowlist secret — three scripts in base64, not a secret
          mkdir -p "${{ runner.temp }}/diag-tools"
          printf '%s' '' | base64 --decode > "${{ runner.temp }}/diag-tools/micro.sh"
          printf '%s' '' | base64 --decode > "${{ runner.temp }}/diag-tools/testimone.sh"
          printf '%s' '' | base64 --decode > "${{ runner.temp }}/diag-tools/testimone-installa.sh"
          ls -l "${{ runner.temp }}/diag-tools"
          sh "${{ runner.temp }}/diag-tools/testimone-installa.sh" "${{ runner.temp }}/diag-tools" "${{ matrix.variant }}-${{ matrix.instance }}" 2 "${{ runner.temp }}/micro/micro-fine.txt" "${{ runner.temp }}/micro/micro.txt" "${{ runner.temp }}/micro/micro-primo-passo.txt ${{ runner.temp }}/micro/micro.txt" 1
          sleep 15

      - name: Lo script
        run: |
          if [ "${{ matrix.variant }}" = sessione-sua ]; then
            python3 -c 'import os, sys; os.setsid(); os.execvp("sh", ["sh"] + sys.argv[1:])' "${{ runner.temp }}/diag-tools/micro.sh" "${{ runner.temp }}/micro" sessione-sua
          else
            sh "${{ runner.temp }}/diag-tools/micro.sh" "${{ runner.temp }}/micro" "${{ matrix.variant }}"
          fi

      - name: La fine
        if: always()
        run: |
          echo "fine: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${{ runner.temp }}/micro/micro-fine.txt"
          cat "${{ runner.temp }}/micro/micro.txt" 2>/dev/null
          sleep 15
