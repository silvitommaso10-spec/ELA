name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ADR 0053 §1, paid by M6.3c (ADR 0054 §1): Linux is a written version, not a label that
        # moves by itself. `ubuntu-24.04` is the image `ubuntu-latest` resolved to on the last green
        # run before the pin (run 36732243902, image 20260920.314.1), so the pin changes nothing the
        # suite has seen; Ubuntu 26 comes in its own commit, once Playwright supports it (§3).
        os: [ubuntu-24.04, macos-latest]
    steps:
      # The whole history, not the last commit: `tests/docs/test_changelog.py` asks `main`
      # which milestones have been merged, and a shallow clone would answer "none" with a
      # success — a test that passes while seeing nothing (ADR 0031 §6).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every action runs on Node.js 24 (ADR 0054 §1). setup-uv has published no major tag since
      # v8.0.0, only immutable full ones, so it is the one action pinned to a whole version.
      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # The browser of M13.4 (ADR 0052): the Chrome Headless Shell of the version the lock names,
      # which `uv sync` does not download. The two runners of `make check` run the tests of the real
      # browser; the Windows job does not, because the browser does not travel to a node (form A).
      # The cache is keyed on Playwright's version and saved **even when the job fails**, so that a
      # red commit still leaves it for the next push — the measure of number 4 needs both halves.
      - name: Playwright's version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        run: uv run playwright install --only-shell chromium

      - name: Save the browser
        if: always() && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: make check
        run: make check

  # M12.4 dec. H: the node's suite on a real Windows machine, before the merge — the lesson of
  # 2026-09-08 in CLAUDE.md, for the one package that runs on a PC. A named list and not the whole
  # suite, with no coverage gate and no `make`: the Makefile is POSIX shell, and the rest of the suite
  # does not run on Windows (M12.4, Out of scope 5).
  node-windows:
    name: node suite (windows-latest)
    runs-on: windows-latest
    steps:
      # `core.autocrlf` is left to the runner's default, on purpose: the job runs as someone who
      # clones without flags, which is what `.gitattributes` protects (M12.4, «Da portare
      # all'utente» 7).
      - uses: actions/checkout@v7

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # No `-q`: `addopts` has one, and with two pytest drops the line of counts criterion 17 reads.
      # `-rs` names every skip with its reason — the Darwin kit's and the 0o600 bits' among them —
      # because a skip the summary does not name is a defence that does not exist (review of dec. G).
      # The files reserved to Windows are named here, one by one (M13.3, form J; ADR 0048): the ones
      # left out are in `tests/windows.py`, with the reason, and a test fails for a file in neither.
      - name: The node's suite
        run: uv run pytest -p no:cacheprovider --no-cov -rs tests/node tests/conformance tests/composition/test_build_node.py tests/infrastructure/machine/test_acl_smoke.py tests/infrastructure/machine/test_power_smoke.py tests/tools/test_paths_windows.py tests/tools/test_fs_windows.py
