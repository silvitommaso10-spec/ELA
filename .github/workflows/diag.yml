# The observation of the macOS runner that falls (decision 82 of the branch m13.11-il-browser-sul-pc).
# It lives on the branch diag-m13.11-osservazione only, which never enters main, and runs only on
# the branches diag-**. `make check` runs in the background, and every 2 minutes a round copies
# the folder of the suite's log — the log, the output of `make check`, the sampler's file — and
# carries it away as an artifact: what the machine knows leaves it before the machine can die with
# it. The hour of every step stays in the API even when the runner falls: the last step that
# completed gives the window of the fall. Three variants on macOS: «come-e», f3a25bc as it is;
# «casa-ferma», the fence of the environment leaves HOME and USERPROFILE where they are; «senza-ast»,
# tests/scripts/test_every_way_a_test_runs_a_script.py deselected. ci.yml is not touched.
# Written by .git/m13.11-il-browser-sul-pc-reference/diag/genera_workflow.py.
name: Diag

on:
  push:
    branches: ['diag-**']

concurrency:
  group: diag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: observe (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            variant: come-e
          - os: macos-latest
            variant: come-e
          - os: macos-latest
            variant: casa-ferma
          - os: macos-latest
            variant: senza-ast
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Playwright's version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Which browsers this runner installs
        id: browsers
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "set=shell-and-chrome-for-testing" >> "$GITHUB_OUTPUT"
          else
            echo "set=shell" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the browser
        id: browser
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.browsers.outputs.set }}

      - name: Install the browser
        run: uv run playwright install --only-shell chromium

      - name: Install Chrome for Testing
        if: runner.os == 'macOS'
        run: uv run playwright install --no-shell chromium

      - name: Save the browser
        if: always() && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.browsers.outputs.set }}

      - name: Snapshot zero
        continue-on-error: true
        run: sh .github/diag/snapshot-zero.sh "${{ runner.temp }}/suite-log" "${{ matrix.variant }}"

      - name: Snapshot zero, carried away
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.variant }}-${{ matrix.os }}-00
          path: ${{ runner.temp }}/suite-log/
          if-no-files-found: warn

      - name: The machine's sampler
        continue-on-error: true
        run: nohup sh .github/sampler.sh "${{ runner.temp }}/suite-log" 10 5400 > /dev/null 2>&1 < /dev/null &

      - name: make check, in the background
        env:
          SUITE_LOG: ${{ runner.temp }}/suite-log
        run: |
          case "${{ matrix.variant }}" in
            casa-ferma) export DIAG_CASA_FERMA=1 ;;
            senza-ast) export PYTEST_ADDOPTS="--deselect tests/scripts/test_every_way_a_test_runs_a_script.py" ;;
          esac
          nohup sh -c 'make check > "$SUITE_LOG/make-check.txt" 2>&1; code=$?; echo "$code" > "$SUITE_LOG/make-check-exit.part"; mv "$SUITE_LOG/make-check-exit.part" "$SUITE_LOG/make-check-exit.txt"' > /dev/null 2>&1 < /dev/null &
          echo "LAUNCHED=1" >> "$GITHUB_ENV"

      - name: Round 01, the wait
        id: wait01
        if: always() && env.LAUNCHED == '1' && env.DONE != '1'
        continue-on-error: true
        run: sh .github/diag/round.sh "${{ runner.temp }}/suite-log" "${{ runner.temp }}/snap" 120

      - name: Round 01, the snapshot
        if: always() && steps.wait01.outputs.went == '1'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.variant }}-${{ matrix.os }}-01
          path: ${{ runner.temp }}/snap/
          if-no-files-found: warn

      - name: Round 02, the wait
        id: wait02
        if: always() && env.LAUNCHED == '1' && env.DONE != '1'
        continue-on-error: true
        run: sh .github/diag/round.sh "${{ runner.temp }}/suite-log" "${{ runner.temp }}/snap" 120

      - name: Round 02, the snapshot
