<form method="post" action="/console/answer">
  <input type="hidden" name="id" value="{id}">
  <div class="ela-cluster">
    <button class="ela-button ela-button--primary" type="submit" name="answer" value="yes">Approva</button>
    <span class="ela-grow"></span>
    <button class="ela-button ela-button--danger" type="submit" name="answer" value="no">Rifiuta</button>
  </div>
</form>
