{nav}
<div class="ela-panel ela-panel--soft">
  <div class="ela-stack">
    <p class="ela-eyebrow">Fermare questo task</p>
    <p class="ela-title">{what}</p>
    <p class="ela-body">Adesso è {state}. Fermarlo non si può annullare. Nessuno step nuovo partirà. Uno step che ha già agito può finire ciò che ha cominciato: il riassunto del task dirà se aveva agito.</p>
    <form method="post" action="/console/cancel">
      <input type="hidden" name="id" value="{id}">
      <button class="ela-button ela-button--danger" type="submit">Ferma il task</button>
    </form>
    <p class="ela-caption"><a href="/console/">Lascia perdere</a></p>
  </div>
</div>
