<div class="ela-field">
  <label class="ela-field__label" for="field-message{id}">Message</label>
  <input class="ela-field__input" id="field-message{id}" type="text" value="Reply to project discussion" aria-describedby="field-message-help{id}">
  <p class="ela-field__help" id="field-message-help{id}">Shown to the recipient.</p>
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-ask{id}">Ask</label>
  <input class="ela-field__input ela-field__input--pill" id="field-ask{id}" type="text" placeholder="Ask ELA…">
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-hover{id}">Hover</label>
  <input class="ela-field__input is-hover" id="field-hover{id}" type="text" value="Hover">
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-focus{id}">Focus</label>
  <input class="ela-field__input is-focus-visible" id="field-focus{id}" type="text" value="Focus">
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-active{id}">Active</label>
  <input class="ela-field__input is-active" id="field-active{id}" type="text" value="Active">
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-recipient{id}">Recipient</label>
  <input class="ela-field__input" id="field-recipient{id}" type="text" value="not an address" aria-invalid="true" aria-describedby="field-recipient-error{id}">
  <p class="ela-field__error" id="field-recipient-error{id}">This is not an address ELA can write to.</p>
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-locked{id}">Disabled</label>
  <input class="ela-field__input" id="field-locked{id}" type="text" value="Decided by policy" disabled>
</div>
<div class="ela-field">
  <label class="ela-field__label" for="field-note{id}">Note</label>
  <textarea class="ela-field__input" id="field-note{id}" rows="3">A longer answer, on more than one line.</textarea>
</div>
