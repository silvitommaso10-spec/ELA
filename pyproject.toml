[project]
name = "ela"
version = "0.1.0"
description = "ELA — Executive Life Assistant: assistente personale AI autonomo e distribuito"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.12",
    "mypy>=1.16",
    "import-linter>=2.3",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "pymupdf>=1.26",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ela --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["ela"]

[tool.importlinter]
root_package = "ela"
include_external_packages = true

# Le regole sono documentate in docs/adr/0002-architecture-rules.md. Ogni contratto ha la
# versione "closed-world" in tests/architecture/rules.py; tests/architecture/test_import_linter.py
# verifica che le liste qui sotto coprano tutti i package attuali di ela.

[[tool.importlinter.contracts]]
name = "1. domain importa solo stdlib e pydantic (CLAUDE.md, spec §49, §52)"
type = "forbidden"
source_modules = ["ela.domain"]
forbidden_modules = [
    "ela.ports",
    "ela.api",
    "ela.audit",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.infrastructure",
    "ela.memory",
    "ela.permissions",
    "ela.providers",
    "ela.tasks",
    "ela.tools",
    "anthropic",
    "openai",
    "httpx",
    "sqlalchemy",
    "fastapi",
    "typer",
]

[[tool.importlinter.contracts]]
name = "2. ports importa solo stdlib e domain (CLAUDE.md, spec §49, §52)"
type = "forbidden"
source_modules = ["ela.ports"]
forbidden_modules = [
    "ela.api",
    "ela.audit",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.infrastructure",
    "ela.memory",
    "ela.permissions",
    "ela.providers",
    "ela.tasks",
    "ela.tools",
    "pydantic",
    "anthropic",
    "openai",
    "httpx",
    "sqlalchemy",
    "fastapi",
    "typer",
]

[[tool.importlinter.contracts]]
name = "3. solo providers, infrastructure e api importano librerie di infrastruttura (CLAUDE.md, spec §26, §50)"
type = "forbidden"
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.audit",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.memory",
    "ela.permissions",
    "ela.tasks",
    "ela.tools",
]
forbidden_modules = ["anthropic", "openai", "httpx", "sqlalchemy", "fastapi", "typer"]

[[tool.importlinter.contracts]]
name = "4. executive, tasks, permissions e audit non importano providers né infrastructure (CLAUDE.md, spec §52)"
type = "forbidden"
source_modules = ["ela.executive", "ela.tasks", "ela.permissions", "ela.audit"]
forbidden_modules = ["ela.providers", "ela.infrastructure"]
