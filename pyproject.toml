type = "forbidden"
# Direct imports only (ADR 0013 §13): whoever uses the engine — the executor, the orchestrator,
# the API — reaches the state machine through it without being able to call ``transition``.
allow_indirect_imports = "True"
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.api",
    "ela.audit",
