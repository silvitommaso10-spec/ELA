<div class="ela-frame ela-frame--phone ela-stack">
  <div class="ela-stack ela-stack--center">
    <div class="ela-presence" data-ela-state="WAITING APPROVAL">
      {include:_orb}
      <span class="ela-presence__text">
        <span class="ela-wordmark">ELA</span>
        <span class="ela-presence__key">WAITING APPROVAL</span>
      </span>
    </div>
  </div>
  <div class="ela-panel ela-panel--soft ela-panel--warm">
    <div class="ela-stack">
      <p class="ela-eyebrow">ELA requests approval</p>
      <p class="ela-title">Send an email to Marco Ferri</p>
      <p class="ela-caption">Reply to the project discussion. From the MacBook · this task only.</p>
      <span class="ela-level" data-ela-risk="MEDIUM">
        <span class="ela-level__key">MEDIUM</span>
        <span class="ela-meter" aria-hidden="true"><span class="ela-meter__segment"></span><span class="ela-meter__segment"></span><span class="ela-meter__segment"></span><span class="ela-meter__segment"></span><span class="ela-meter__segment"></span></span>
      </span>
      <button class="ela-button ela-button--primary ela-button--block" type="button">Approve</button>
      <div class="ela-cluster">
        <button class="ela-button ela-grow" type="button">Read message</button>
        <button class="ela-button ela-button--danger ela-grow" type="button">Deny</button>
      </div>
    </div>
  </div>
  <div class="ela-panel ela-panel--soft">
    <div class="ela-stack ela-stack--tight">
      <p class="ela-eyebrow">Now</p>
      <p class="ela-body ela-strong">Preparing tomorrow's meeting briefing</p>
      <p class="ela-caption ela-muted">Analysing documents · MacBook</p>
    </div>
  </div>
  <div class="ela-grid ela-grid--thirds">
    <div class="ela-panel ela-panel--soft ela-panel--inset ela-tile">
      <p class="ela-eyebrow">Tasks</p>
      <p class="ela-number">3</p>
    </div>
    <div class="ela-panel ela-panel--soft ela-panel--inset ela-tile">
      <p class="ela-eyebrow">Devices</p>
      <p class="ela-number">3</p>
    </div>
    <div class="ela-panel ela-panel--soft ela-panel--inset ela-tile">
      <p class="ela-eyebrow">Attention</p>
      <p class="ela-number">1</p>
    </div>
  </div>
  <div class="ela-cluster">
    <div class="ela-field ela-grow">
      <label class="ela-field__label" for="phone-ask{id}">Ask ELA</label>
      <input class="ela-field__input ela-field__input--pill" id="phone-ask{id}" type="text" placeholder="Ask ELA…">
    </div>
    <button class="ela-button" type="button">Talk</button>
  </div>
</div>
