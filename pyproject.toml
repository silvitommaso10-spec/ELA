    "ela.routing",
    "ela.testing",
    "ela.tools",
]
forbidden_modules = ["ela.tasks.state_machine"]

[[tool.importlinter.contracts]]
name = "8. ela.permissions importa solo stdlib, domain, ports e jsonschema: il Guardian è indipendente dal resto (ADR 0010)"
type = "forbidden"
# Direct imports only, as for contracts 2 and 6: the domain brings pydantic, jsonschema its own.
allow_indirect_imports = "True"
source_modules = ["ela.permissions"]
forbidden_modules = [
