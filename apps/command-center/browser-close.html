<form method="post" action="/console/browser/close">
  <input type="hidden" name="browser" value="close">
  <div class="ela-stack ela-stack--tight">
    <p class="ela-caption">Il pulsante rosso della finestra chiude la finestra e lascia il browser acceso: per ELA è ancora aperto. Questo lo fa uscire: lo avvisa, lo aspetta, e solo se non esce lo termina.</p>
    <button class="ela-button ela-button--danger" type="submit">Chiudi il browser</button>
  </div>
</form>
