# Alembic configuration of ELA (M2.1, ADR 0006).
# sqlalchemy.url is deliberately absent: migrations/env.py reads ELA_DB_URL through
# PersistenceSettings, so the CLI and the application agree on where the database is.
# From the repo root: uv run alembic upgrade head   (elsewhere: alembic -c <this file> …)

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/src
path_separator = os
