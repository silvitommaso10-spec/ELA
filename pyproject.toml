[project]
name = "ela"
version = "0.1.0"
description = "ELA — Executive Life Assistant: assistente personale AI autonomo e distribuito"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.15",
    "uvicorn>=0.32",
]

# `ela`: the command line of M8.2. It talks to the running ELA over the local API (ADR 0024);
# `python -m ela.api` stays what `ela serve` calls.
[project.scripts]
ela = "ela.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.12",
    "mypy>=1.16",
    "import-linter>=2.3",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "pymupdf>=1.26",
    "pytest-asyncio>=1.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ela --cov-branch --cov-report=term-missing"
# Async ports (ADR 0005): every ``async def test_*`` runs on a fresh event loop, no marker needed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["ela"]
# SQLAlchemy's async adapter switches greenlets inside a connect listener (M2.1); without this,
# coverage loses the frame after the switch and reports the rest of the listener as unrun.
concurrency = ["thread", "greenlet"]

[tool.importlinter]
root_package = "ela"
include_external_packages = true

# Le regole sono documentate in docs/adr/0002-architecture-rules.md. Ogni contratto ha la
# versione "closed-world" in tests/architecture/rules.py; tests/architecture/test_import_linter.py
# verifica che le liste qui sotto coprano tutti i package attuali di ela.

[[tool.importlinter.contracts]]
name = "1. domain importa solo stdlib e pydantic (CLAUDE.md, spec §49, §52)"
type = "forbidden"
source_modules = ["ela.domain"]
forbidden_modules = [
    "ela.ports",
    "ela.api",
    "ela.audit",
    "ela.cli",
    "ela.composition",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.infrastructure",
    "ela.memory",
    "ela.perception",
    "ela.permissions",
    "ela.providers",
    "ela.routing",
    "ela.tasks",
    "ela.testing",
    "ela.tools",
    "anthropic",
    "openai",
    "httpx",
    "sqlalchemy",
    "alembic",
    "aiosqlite",
    "fastapi",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "2. ports importa solo stdlib e domain (CLAUDE.md, spec §49, §52)"
type = "forbidden"
# Direct imports only: ports -> domain -> pydantic is the domain's dependency, not the ports'.
allow_indirect_imports = "True"
source_modules = ["ela.ports"]
forbidden_modules = [
    "ela.api",
    "ela.audit",
    "ela.cli",
    "ela.composition",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.infrastructure",
    "ela.memory",
    "ela.perception",
    "ela.permissions",
    "ela.providers",
    "ela.routing",
    "ela.tasks",
    "ela.testing",
    "ela.tools",
    "pydantic",
    "anthropic",
    "openai",
    "httpx",
    "sqlalchemy",
    "alembic",
    "aiosqlite",
    "fastapi",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "3. solo providers, infrastructure e api importano librerie di infrastruttura (CLAUDE.md, spec §26, §50)"
type = "forbidden"
# Direct imports only (M8.1): ela.composition importa ela.infrastructure e ela.providers — è ciò
# per cui esiste — e attraverso di loro raggiunge sqlalchemy e l'SDK. La regola parla di chi
# *nomina* una libreria, e la versione closed-world in rules.py legge gli import di ogni file.
allow_indirect_imports = "True"
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.audit",
    "ela.composition",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.memory",
    "ela.perception",
    "ela.permissions",
    "ela.routing",
    "ela.tasks",
    "ela.testing",
    "ela.tools",
]
forbidden_modules = [
    "anthropic",
    "openai",
    "httpx",
    "sqlalchemy",
    "alembic",
    "aiosqlite",
    "fastapi",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "4. executive, tasks, permissions, perception, audit e routing non importano providers né infrastructure (CLAUDE.md, spec §52)"
type = "forbidden"
source_modules = [
    "ela.executive",
    "ela.tasks",
    "ela.permissions",
    "ela.perception",
    "ela.audit",
    "ela.routing",
]
forbidden_modules = ["ela.providers", "ela.infrastructure"]

[[tool.importlinter.contracts]]
name = "5. nessun modulo di produzione importa ela.testing: i fake servono solo ai test (CLAUDE.md, spec §51)"
type = "forbidden"
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.api",
    "ela.audit",
    "ela.cli",
    "ela.composition",
