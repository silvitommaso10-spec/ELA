[project]
name = "ela"
version = "0.1.0"
description = "ELA — Executive Life Assistant: assistente personale AI autonomo e distribuito"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.12",
    "mypy>=1.16",
    "import-linter>=2.3",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "pymupdf>=1.26",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ela --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["ela"]

[tool.importlinter]
root_package = "ela"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain e ports non dipendono da provider, api o tool (CLAUDE.md, spec §49, §52)"
type = "forbidden"
source_modules = ["ela.domain", "ela.ports"]
forbidden_modules = ["ela.providers", "ela.api", "ela.tools"]

[[tool.importlinter.contracts]]
name = "il Core non importa librerie di infrastruttura (CLAUDE.md, spec §26, §50)"
type = "forbidden"
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.executive",
    "ela.memory",
    "ela.identity",
    "ela.context",
    "ela.tasks",
    "ela.devices",
    "ela.permissions",
    "ela.audit",
    "ela.tools",
    "ela.evolution",
]
forbidden_modules = ["anthropic", "openai", "sqlalchemy", "fastapi", "httpx"]
