name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # The whole history, not the last commit: `tests/docs/test_changelog.py` asks `main`
      # which milestones have been merged, and a shallow clone would answer "none" with a
      # success — a test that passes while seeing nothing (ADR 0031 §6).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: make check
        run: make check
