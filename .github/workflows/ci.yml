name: CI

on:
  push:
  pull_request:

# A run that started always finishes (CLAUDE.md, decision 2 of M14.6b): a run a push cancels is a
# verification nobody saw, and on 2026-11-03 one that would have been red was cancelled that way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ADR 0053 §1, paid by M6.3c (ADR 0054 §1): Linux is a written version, not a label that
        # moves by itself. `ubuntu-24.04` is the image `ubuntu-latest` resolved to on the last green
        # run before the pin (run 36732243902, image 20260920.314.1), so the pin changes nothing the
        # suite has seen; Ubuntu 26 comes in its own commit, once Playwright supports it (§3).
        os: [ubuntu-24.04, macos-latest]
    steps:
      # The whole history, not the last commit: `tests/docs/test_changelog.py` asks `main`
      # which milestones have been merged, and a shallow clone would answer "none" with a
      # success — a test that passes while seeing nothing (ADR 0031 §6).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every action runs on Node.js 24 (ADR 0054 §1). setup-uv has published no major tag since
      # v8.0.0, only immutable full ones, so it is the one action pinned to a whole version.
      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # The browser of M13.4 (ADR 0052): the Chrome Headless Shell of the version the lock names,
      # which `uv sync` does not download. The two runners of `make check` run the tests of the real
      # browser; the Windows job does not, because the browser does not travel to a node (form A).
      # The cache is keyed on Playwright's version and saved **even when the job fails**, so that a
      # red commit still leaves it for the next push — the measure of number 4 needs both halves.
      - name: Playwright's version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      # The browser with the profile of M13.9 (ADR 0063) is Chrome for Testing of the same lock, and
      # runs on a Mac only: the macOS runner installs it beside the shell, and the tests of that
      # adapter fail there — they do not skip — when it is missing. **What a runner installs is part
      # of the cache's key**: a cache saved when the runner installed the shell alone would otherwise
      # be restored as a hit, and the save below — which runs only on a miss — would never add it.
      - name: Which browsers this runner installs
        id: browsers
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "set=shell-and-chrome-for-testing" >> "$GITHUB_OUTPUT"
          else
            echo "set=shell" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the browser
        id: browser
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.browsers.outputs.set }}

      - name: Install the browser
        run: uv run playwright install --only-shell chromium

      - name: Install Chrome for Testing
        if: runner.os == 'macOS'
        run: uv run playwright install --no-shell chromium

      - name: Save the browser
        if: always() && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.browsers.outputs.set }}

      # The machine's sampler (answer 67 B of the branch m13.11-il-browser-sul-pc): an instrument,
      # not a defence. Every 30 seconds `.github/sampler.sh` appends to the folder of the suite's log
      # the time, the load, the memory and the processes by name — what the macOS runner did not say
      # of itself when it lost communication, twice, on 2026-11-20. It starts before `make check` and
      # runs in the background through it, with its streams closed, so the step ends at once; the
      # step of the log carries its file away, and the end of the job stops it. Its failure turns no
      # job red: `continue-on-error`, and every exit of the script is 0. `make check` is unchanged.
      - name: The machine's sampler
        continue-on-error: true
        run: nohup sh .github/sampler.sh "${{ runner.temp }}/suite-log" > /dev/null 2>&1 < /dev/null &

      # The log of the suite (tests/suite_log.py, M9.5, decision 75): which test ran on which worker,
      # when and for how long — what the log of a red did not say on 2026-11-12. Only here: without
      # `SUITE_LOG` the suite writes nothing, and `make check` on a Mac prints what it printed.
      # **A limit on the step, not on the job** (answer 63 of the branch m13.11-il-browser-sul-pc): a
      # suite that hangs is cut while the runner is still alive, and the next step, which always
      # runs, carries the log away. On 2026-11-20 the macOS runner of a83da54 lost communication 53
      # minutes into this step, and no log was left. The rule, written before the number: twice the
      # longest healthy step among the runs in the workshop, rounded up to five minutes — macOS of
      # bab6484 (run 43018768007), 31m39s: 65. ***Revised on 2026-11-21*** (answer 67 B): that rule
      # gave a number above the fall it had to cut — the runner of a83da54 fell 53m39s into this
      # step, that of 354bebf 56m37s into it, both under 65, and neither left a log. The rule,
      # written before the number: the longest healthy macOS step plus a quarter, rounded up to five
      # minutes, and at least ten minutes below the shortest fall — 31m39s × 1.25 = 39m34s: 40,
      # under 53m39s − 10m = 43m39s.
      - name: make check
        timeout-minutes: 40
        env:
          SUITE_LOG: ${{ runner.temp }}/suite-log
        run: make check

      # An instrument, not a defence: it runs whatever `make check` said, and its failure turns no
      # job red (`continue-on-error`). `gh run download <id>` brings it to the workshop.
      - name: The log of the suite
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: suite-log-${{ matrix.os }}
          path: ${{ runner.temp }}/suite-log/
          if-no-files-found: warn

  # M12.4 dec. H: the node's suite on a real Windows machine, before the merge — the lesson of
  # 2026-09-08 in CLAUDE.md, for the one package that runs on a PC. A named list and not the whole
  # suite, with no coverage gate and no `make`: the Makefile is POSIX shell, and the rest of the suite
  # does not run on Windows (M12.4, Out of scope 5).
  node-windows:
    name: node suite (windows-latest)
    runs-on: windows-latest
    steps:
      # `core.autocrlf` is left to the runner's default, on purpose: the job runs as someone who
      # clones without flags, which is what `.gitattributes` protects (M12.4, «Da portare
      # all'utente» 7).
      - uses: actions/checkout@v7

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # No `-q`: `addopts` has one, and with two pytest drops the line of counts criterion 17 reads.
      # `-ra` names every skip with its reason — the Darwin kit's and the 0o600 bits' among them —
      # because a skip the summary does not name is a defence that does not exist (review of dec. G),
      # and every failure and error too: `-r` replaces the suite's letters instead of adding to
      # them, and until M9.5 this was `-rs`, a summary without its failures. No less than `addopts`
      # (tests/scripts/test_skip_reasons.py).
      # `tests/composition/test_own_command.py` is not the node's: it is here because where ELA's
      # own command is installed — beside the interpreter, as `ela.exe` — is a fact of this system
      # that only this runner can measure (M13.9, decision 98).
      # The files reserved to Windows are named here, one by one (M13.3, form J; ADR 0048): the ones
      # left out are in `tests/windows.py`, with the reason, and a test fails for a file in neither.
      - name: The node's suite
        run: uv run pytest -p no:cacheprovider --no-cov -ra tests/node tests/conformance tests/composition/test_build_node.py tests/infrastructure/machine/test_acl_smoke.py tests/infrastructure/machine/test_power_smoke.py tests/tools/test_paths_windows.py tests/tools/test_fs_windows.py tests/composition/test_own_command.py tests/scripts/test_the_fences_on_windows.py tests/scripts/test_misura_m13_11_windows.py
