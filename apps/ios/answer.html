<form method="post" action="/companion/answer">

  <div class="ela-stack ela-stack--tight">
    <button class="ela-button ela-button--primary ela-button--block" type="submit" name="answer" value="yes">Sì</button>
    <button class="ela-button ela-button--danger ela-button--block" type="submit" name="answer" value="no">No</button>
  </div>
</form>
