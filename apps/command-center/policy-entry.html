<input type="hidden" name="by_value" value="{by_value}">
<div class="ela-field">
  <label class="ela-field__label" for="policy-entry-{capability}">Id della voce</label>
  <input class="ela-field__input" id="policy-entry-{capability}" name="value" autocomplete="off">
  <p class="ela-field__help">L'id della voce del vault, letto da te nell'app di Bitwarden: ELA non elenca le voci. Il vault deve essere aperto, e la policy mostrerà la voce con il suo nome e il nome utente mascherato, mai l'id.</p>
</div>
