# The observation of the macOS runner that falls (decisions 82, 89, 91, 92, 101, 102, 110, 111, 119,
# 120, 127, 128 and 132 of the branch m13.11-il-browser-sul-pc). It lives on the branch diag-m13.11-osservazione only,
# which never enters main, and runs only on the branches diag-**. macOS only, eleven jobs, five at
# a time: the others wait in the queue. Every job runs the whole `make check` in the background,
# with its streams closed and without nohup; every round of 120 seconds copies the folder of the
# suite's log and carries it away as an artifact, and a black box sends a comment to the issue
# #2 every 60 seconds, and from the first line of tests/infrastructure every 5 seconds for
# 90 seconds and every 15 up to four minutes: what the machine knows leaves it before the machine
# can die with it. The hour of every step stays in the API even when the runner falls. The first
# step, before the checkout, writes how the machine arrived (decision 101); a LaunchDaemon of the
# system, loaded at once and running as root outside the graphical session, is the witness of the
# session (decisions 128 and 132). The variants (decision 127): «controllo-con-zavorra», the tree at
# da241f8 with the ballast of zavorra.py — da241f8 with the counts of the new code —;
# «nuovo-conti-vecchi», the tip with its new files ignored, its new ids deselected and a fake file
# of the old ones — the new code with the counts of da241f8 —; «come-e», the tip as it is.
# ci.yml is not touched.
# Written by .git/m13.11-il-browser-sul-pc-reference/diag/genera_workflow.py.
name: Diag

on:
  push:
    branches: ['diag-**']

permissions:
  contents: read
  issues: write

concurrency:
  group: diag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: observe (${{ matrix.os }}, ${{ matrix.variant }} ${{ matrix.instance }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            variant: controllo-con-zavorra
            instance: 1
            every: 120
            tree: 'da241f86cf4c48d8b6507453440ac17665db2ca7'  # pragma: allowlist secret — a commit, not a secret
            ballast: 'controllo'
            addopts: '--ignore=tests/scripts/test_the_proofs_never_launch_for_real.py'
