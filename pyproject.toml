[[tool.importlinter.contracts]]
name = "10. solo ela.providers.anthropic importa l'SDK anthropic (ADR 0020 §11, spec §26, §50)"
type = "forbidden"
# Direct imports only, per la stessa ragione del contratto 3: il composition root importa
# l'adapter, e l'adapter importa l'SDK.
allow_indirect_imports = "True"
# Il contratto 3 lascia l'SDK a tutto providers/, infrastructure/ e api/: qui il confine è un solo
# modulo. ela.providers non compare come sorgente perché includerebbe l'adapter stesso; i suoi
# moduli sono elencati uno per uno e la regola 24 chiude il mondo (tests/architecture/rules.py).
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.api",
    "ela.audit",
    "ela.cli",
    "ela.composition",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.infrastructure",
    "ela.memory",
    "ela.perception",
    "ela.permissions",
    "ela.providers.elevenlabs",
    "ela.providers.registry",
    "ela.routing",
    "ela.tasks",
    "ela.testing",
    "ela.tools",
]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "9. ela.devices non importa ela.tasks: il Device Orchestrator consiglia, non muove un task (ADR 0017)"
type = "forbidden"
source_modules = ["ela.devices"]
forbidden_modules = ["ela.tasks"]

[[tool.importlinter.contracts]]
name = "11. ela.tools non importa ela.routing: un tool riceve il router, non lo costruisce (ADR 0022 §2)"
type = "forbidden"
source_modules = ["ela.tools"]
forbidden_modules = ["ela.routing"]

[[tool.importlinter.contracts]]
name = "12. solo ela.composition nomina i concreti: nessun altro importa providers o infrastructure (ADR 0023 §12)"
type = "forbidden"
# Direct imports only: ela.api importa ela.composition, che nomina i concreti. Raggiungerli
# *attraverso* il composition root è esattamente ciò per cui il composition root esiste.
allow_indirect_imports = "True"
# La regola 4 pone la stessa domanda a cinque package soltanto, perché erano gli unici a cui si
# poneva. Con un composition root si pone a tutti, ela.api compreso: l'API riceve il mondo già
# costruito e non lo costruisce.
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.api",
    "ela.audit",
    "ela.cli",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
    "ela.memory",
    "ela.perception",
    "ela.permissions",
    "ela.routing",
    "ela.tasks",
    "ela.testing",
    "ela.tools",
]
forbidden_modules = ["ela.providers", "ela.infrastructure"]

[[tool.importlinter.contracts]]
name = "14. ela.context non raggiunge chi decide né chi esegue: comporre non è agire (ADR 0032 §6)"
type = "forbidden"
# La metà "porta" della regola 38. L'altra metà — le *chiamate* di scrittura — è un walk
# dell'AST, perché un port arriva dal costruttore e non lascia nessun import da vedere.
# ela.perception non è vietata: è pura, sta nel gate, e osservare non è agire (ADR 0029 §5).
# ela.devices nemmeno: il registro deriva la disponibilità e nessun altro può farlo (regola 20),
# quindi la risposta va chiesta a lui.
source_modules = ["ela.context"]
forbidden_modules = [
    "ela.api",
    "ela.cli",
    "ela.composition",
    "ela.executive",
    "ela.infrastructure",
    "ela.permissions",
    "ela.providers",
    "ela.routing",
    "ela.tools",
]

[[tool.importlinter.contracts]]
name = "13. nessuno importa ela.cli: la CLI è un client, non una libreria (ADR 0024 §7)"
type = "forbidden"
# La seconda clausola della regola 28. Una CLI che qualcuno importa è una CLI diventata libreria
# senza che nessuno l'abbia deciso: i comandi si invocano, e ciò che sanno fare sta dietro l'API.
source_modules = [
    "ela.domain",
    "ela.ports",
    "ela.api",
    "ela.audit",
    "ela.composition",
    "ela.context",
    "ela.devices",
    "ela.evolution",
    "ela.executive",
    "ela.identity",
