        run: |
          mkdir -p "${{ runner.temp }}/suite-log"
          {
            echo "=== la macchina com'è arrivata (decisione 101): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "variant: ${{ matrix.variant }}-${{ matrix.instance }}"
            echo "kern.boottime: $(sysctl -n kern.boottime)"
            echo "uptime: $(uptime)"
            df -k /System/Volumes/Data || echo "df: uscita $?"
            echo "mdworker_shared: $(pgrep -x mdworker_shared | wc -l | tr -d ' ')"
            echo "mdutil -a -s:"
            mdutil -a -s || echo "mdutil -a -s: uscita $?"
          } 2>&1 | tee "${{ runner.temp }}/suite-log/arrived.txt"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The instruments, outside the tree
        run: |
          tools="${{ runner.temp }}/diag-tools"
          mkdir -p "$tools"
          cp .github/diag/blackbox.sh .github/diag/round.sh .github/diag/snapshot-zero.sh .github/diag/testimone-installa.sh .github/diag/testimone.sh .github/diag/zavorra.py .github/sampler.sh "$tools"/
          ls -l "$tools"
          tree="${{ matrix.tree }}"
          if [ -n "$tree" ]; then
            git checkout --quiet --detach "$tree"
            head=$(git rev-parse HEAD)
            changed=$(git status --porcelain --untracked-files=all)
            echo "HEAD: $head"
            echo "git status --porcelain: ${changed:-vuoto}"
            echo "git status --porcelain --ignored: $(git status --porcelain --ignored | wc -l | tr -d ' ') righe"
            [ "$head" = "$tree" ] && [ -z "$changed" ]
          fi

      - name: The ballast
        if: matrix.ballast != ''
        run: |
          python3 "${{ runner.temp }}/diag-tools/zavorra.py" "${{ matrix.ballast }}" .
          echo "git status --porcelain --untracked-files=all:"
          git status --porcelain --untracked-files=all

      - name: The witness outside the session
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "${{ runner.temp }}/diag-tools/testimone-installa.sh" "${{ runner.temp }}/diag-tools" "${{ matrix.variant }}-${{ matrix.instance }}" 2 "${{ runner.temp }}/suite-log/make-check-exit.txt"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Playwright's version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Which browsers this runner installs
        id: browsers
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "set=shell-and-chrome-for-testing" >> "$GITHUB_OUTPUT"
          else
            echo "set=shell" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the browser
        id: browser
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.browsers.outputs.set }}

      - name: Install the browser
        run: uv run playwright install --only-shell chromium

      - name: Install Chrome for Testing
        if: runner.os == 'macOS'
        run: uv run playwright install --no-shell chromium

      - name: Save the browser
        if: always() && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.browsers.outputs.set }}

      - name: Snapshot zero
        continue-on-error: true
        run: sh "${{ runner.temp }}/diag-tools/snapshot-zero.sh" "${{ runner.temp }}/suite-log" "${{ matrix.variant }}-${{ matrix.instance }}"

      - name: Snapshot zero, carried away
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.variant }}-${{ matrix.instance }}-${{ matrix.os }}-00
          path: ${{ runner.temp }}/suite-log/
          if-no-files-found: warn

      - name: The machine's sampler
        continue-on-error: true
        run: sh "${{ runner.temp }}/diag-tools/sampler.sh" "${{ runner.temp }}/suite-log" 10 5400 > /dev/null 2>&1 < /dev/null &

      - name: The black box
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "${{ runner.temp }}/diag-tools/blackbox.sh" "${{ runner.temp }}/suite-log" "${{ matrix.variant }}-${{ matrix.instance }}" 2 60 5400 5 90 15 240 > /dev/null 2>&1 < /dev/null &

      - name: make check, in the background
        env:
          SUITE_LOG: ${{ runner.temp }}/suite-log
          PYTEST_ADDOPTS: ${{ matrix.addopts }}
        run: |
          set -- make check
          echo "$* at $(git rev-parse HEAD) (PYTEST_ADDOPTS=${PYTEST_ADDOPTS-})" > "$SUITE_LOG/command.txt"
          sh -c '"$@" > "$SUITE_LOG/make-check.txt" 2>&1; code=$?; echo "$code" > "$SUITE_LOG/make-check-exit.part"; mv "$SUITE_LOG/make-check-exit.part" "$SUITE_LOG/make-check-exit.txt"' sh "$@" > /dev/null 2>&1 < /dev/null &
          echo "LAUNCHED=1" >> "$GITHUB_ENV"

      - name: Round 01, the wait
        id: wait01
        if: always() && env.LAUNCHED == '1' && env.DONE != '1'
        continue-on-error: true
        run: sh "${{ runner.temp }}/diag-tools/round.sh" "${{ runner.temp }}/suite-log" "${{ runner.temp }}/snap" ${{ matrix.every }}

