<div class="ela-stack ela-stack--tight">
  <div class="ela-row" data-ela-state="WORKING">
    {include:_orb}
    <p class="ela-row__title">MacBook <span class="ela-row__meta">· Active</span></p>
    <span class="ela-row__key">WORKING</span>
  </div>
  <div class="ela-row" data-ela-state="WAITING">
    {include:_orb}
    <p class="ela-row__title">Windows <span class="ela-row__meta">· Ready</span></p>
    <span class="ela-row__key">WAITING</span>
  </div>
  <div class="ela-row" data-ela-state="IDLE">
    {include:_orb}
    <p class="ela-row__title">iPhone <span class="ela-row__meta">· Online</span></p>
    <span class="ela-row__key">IDLE</span>
  </div>
</div>
