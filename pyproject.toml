    "ela.tasks",
    "ela.tools",
]
forbidden_modules = ["ela.testing"]

[[tool.importlinter.contracts]]
name = "6. ela.testing importa solo stdlib, domain e ports: un fake non dipende da nulla di reale (spec §51)"
type = "forbidden"
# Direct imports only, as for contract 2: the fakes reach pydantic only through the domain.
allow_indirect_imports = "True"
source_modules = ["ela.testing"]
forbidden_modules = [
