<h1 class="ela-title">ELA</h1>
<p class="ela-body">{message}</p>
<form class="ela-stack" method="post" action="/console/enroll">
  <div class="ela-field">
    <label class="ela-field__label" for="enrol-code">Codice</label>
    <input class="ela-field__input" id="enrol-code" name="code" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>
  <div class="ela-field">
    <label class="ela-field__label" for="enrol-name">Nome</label>
    <input class="ela-field__input" id="enrol-name" name="name" value="MacBook">
  </div>
  <div class="ela-field">
    <label class="ela-field__label" for="enrol-os">Sistema</label>
    <input class="ela-field__input" id="enrol-os" name="os" value="MACOS">
  </div>
  <p><button class="ela-button ela-button--primary" type="submit">Arruola questo browser</button></p>
</form>
<p class="ela-caption">Il codice si conia al Mac, con <code>ela node enroll --privacy TRUSTED --role console</code>, e vale dieci minuti.</p>
